name: M1 create next version

on:
  push:
    branches:
      - feature/m1-drupal11-sync
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-next-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create M1_0470 and restore M1_0469
        shell: bash
        run: |
          set -euo pipefail
          cp v3_trim_3_2026/M1_0469.js v3_trim_3_2026/M1_0470.js
          git checkout origin/master -- v3_trim_3_2026/M1_0469.js
          node --check v3_trim_3_2026/M1_0470.js
          git diff --check
          git status --short

      - name: Commit new version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vitalie Bancu"
          git config user.email "64257883+androidacvtivity@users.noreply.github.com"
          git add v3_trim_3_2026/M1_0469.js v3_trim_3_2026/M1_0470.js
          git commit -m "Add M1_0470 Drupal 11 version"
          git push origin HEAD:feature/m1-drupal11-sync
