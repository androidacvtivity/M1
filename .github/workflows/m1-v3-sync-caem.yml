name: M1 V3 sync CAEM patch

on:
  push:
    paths:
      - '.github/workflows/m1-v3-sync-caem.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch M1_0469_3.js
        shell: python
        run: |
          from pathlib import Path

          path = Path('v3_trim_3_2026/M1_0469_3.js')
          text = path.read_text(encoding='utf-8')

          if 'Start sincronizare CAEM Cap.1 -> Cap.2' not in text:
              raw_block = '''// =====================================================
          // Start sincronizare CAEM Cap.1 -> Cap.2
          // =====================================================

          function syncCap1CaemToCap2(columnNumber) {
              var trimValue = Number(
                  jQuery('select[name="TRIM"]').val()
              );

              // Cap.2 este activ numai pentru trimestrul III.
              if (trimValue !== 3) {
                  return;
              }

              var sourceFieldName =
                  'CAP1_CAEM_C' + columnNumber;

              var targetFieldName =
                  'CAP2_CAEM_C' + columnNumber;

              var caem =
                  jQuery('#' + sourceFieldName).val() || '';

              setSelect2Value(
                  '#' + targetFieldName,
                  caem
              );

              updateInternalFieldValue(
                  targetFieldName,
                  caem
              );
          }

          function syncAllCap1CaemToCap2() {
              for (
                  var columnNumber = 2;
                  columnNumber <= 12;
                  columnNumber++
              ) {
                  syncCap1CaemToCap2(columnNumber);
              }
          }

          function getCap1CaemColumn($element) {
              var fieldName =
                  $element.attr('name') ||
                  $element.attr('id') ||
                  $element.attr('field') ||
                  '';

              var matches = fieldName.match(
                  /^CAP1_CAEM_C(\\d+)$/
              );

              if (!matches) {
                  return null;
              }

              return Number(matches[1]);
          }

          var $m1Form = jQuery('#mywebform-edit-form');

          var cap1CaemSelector =
              'select[name^="CAP1_CAEM_C"]';

          // În Drupal 11 jQuery.fn.once nu este disponibil.
          // Eliminăm handler-ele noastre înainte de reatașare.
          $m1Form.off(
              'change.m1Cap1Cap2Caem ' +
              'select2:select.m1Cap1Cap2Caem ' +
              'select2:unselect.m1Cap1Cap2Caem',
              cap1CaemSelector
          );

          $m1Form.on(
              'change.m1Cap1Cap2Caem ' +
              'select2:select.m1Cap1Cap2Caem ' +
              'select2:unselect.m1Cap1Cap2Caem',
              cap1CaemSelector,
              function () {
                  var columnNumber =
                      getCap1CaemColumn(
                          jQuery(this)
                      );

                  if (
                      columnNumber !== null &&
                      columnNumber >= 2 &&
                      columnNumber <= 12
                  ) {
                      syncCap1CaemToCap2(
                          columnNumber
                      );
                  }
              }
          );

          $m1Form.off(
              'mywebform:sync.m1Cap1Cap2Caem',
              cap1CaemSelector
          );

          $m1Form.on(
              'mywebform:sync.m1Cap1Cap2Caem',
              cap1CaemSelector,
              function () {
                  var columnNumber =
                      getCap1CaemColumn(
                          jQuery(this)
                      );

                  if (
                      columnNumber !== null &&
                      columnNumber >= 2 &&
                      columnNumber <= 12
                  ) {
                      syncCap1CaemToCap2(
                          columnNumber
                      );
                  }
              }
          );

          // =====================================================
          // End sincronizare CAEM Cap.1 -> Cap.2
          // ====================================================='''

              indent = ' ' * 12
              block = '\n'.join(
                  (indent + line) if line else ''
                  for line in raw_block.splitlines()
              )
              hide_marker = indent + '// Hide Cap2  Start'
              if hide_marker not in text:
                  raise SystemExit('Hide Cap2 marker not found')
              text = text.replace(hide_marker, block + '\n\n' + hide_marker, 1)

          trim_marker = "            jQuery('select[name=\"TRIM\"]').change(function () {"
          search_from = text.index('Start sincronizare CAEM Cap.1 -> Cap.2')
          trim_start = text.find(trim_marker, search_from)
          if trim_start == -1:
              raise SystemExit('TRIM handler not found')
          trim_end = text.find('            });', trim_start)
          if trim_end == -1:
              raise SystemExit('TRIM handler end not found')
          trim_end += len('            });')
          trim_block = text[trim_start:trim_end]

          if 'syncAllCap1CaemToCap2();' not in trim_block:
              fill_line = '                fillMainCaemFieldsM1();'
              if fill_line not in trim_block:
                  raise SystemExit('fillMainCaemFieldsM1 not found in TRIM handler')
              trim_block = trim_block.replace(
                  fill_line,
                  fill_line + '\n\n' +
                  '                if (Number(trimValue) === 3) {\n' +
                  '                    syncAllCap1CaemToCap2();\n' +
                  '                }',
                  1
              )
              text = text[:trim_start] + trim_block + text[trim_end:]

          init_start = text.find('            var initialTrimValue =', trim_end)
          if init_start == -1:
              raise SystemExit('initialTrimValue not found')
          init_end = text.find('\n\n\n', init_start)
          if init_end == -1:
              init_end = text.find('\n\n        }', init_start)
          if init_end == -1:
              raise SystemExit('initial block end not found')
          init_block = text[init_start:init_end]

          if 'syncAllCap1CaemToCap2();' not in init_block:
              fill_line = '            fillMainCaemFieldsM1();'
              if fill_line not in init_block:
                  raise SystemExit('fillMainCaemFieldsM1 not found in initial block')
              init_block = init_block.replace(
                  fill_line,
                  fill_line + '\n\n' +
                  '            if (Number(initialTrimValue) === 3) {\n' +
                  '                syncAllCap1CaemToCap2();\n' +
                  '            }',
                  1
              )
              text = text[:init_start] + init_block + text[init_end:]

          path.write_text(text, encoding='utf-8')

      - name: Check JavaScript
        run: |
          git diff --check
          node --check v3_trim_3_2026/M1_0469_3.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3_trim_3_2026/M1_0469_3.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Cap1 to Cap2 CAEM synchronization"
            git push
          fi
